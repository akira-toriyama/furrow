name: release

# Tag-driven release: pushing a vX.Y.Z tag renders the body with glyph's
# release-notes action, then runs GoReleaser (binaries, checksums, Homebrew cask)
# and attests the artifacts. Deliberately NOT on every main push — that would run
# GoReleaser with no tag (and before HOMEBREW_TAP_DEPLOY_KEY exists) and fail.
# Dispatch workflow_dispatch on a tag ref only: the notes action takes the ref
# as the tag being released, and a branch name fails it (exit 2). The PR-time
# dry run is build.yml's release-dryrun job.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # mint the OIDC token that signs the build-provenance attestation
  attestations: write # publish the provenance attestation to the repo

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # glyph and GoReleaser only READ local git; every write (release,
          # cask push) goes through API tokens passed as env, never git — drop
          # the persisted checkout token (zizmor artipacked). t-yaxa
          persist-credentials: false

      # A skipped release-prep fails HERE, before anything is built or
      # published: the pushed tag must be the release pin (flake.nix's version,
      # which every PR holds README's pin to). v5.0.0 and v5.1.0 shipped with
      # both still at 4.0.0, and nothing said so. Tag refs only: a
      # workflow_dispatch from a branch has no tag to hold to the pin.
      - name: Assert the tag is the release pin
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: sh scripts/check-version-lockstep.sh "$TAG"

      # go-version: 'stable' + a floor-only go.mod — see build.yml. Ships
      # release binaries built on the current, patched Go without pinning a
      # toolchain that non-CI builds (nix, source installs) may not have.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          # Release binaries must not be built from a shared, poisonable module
          # cache (zizmor cache-poisoning); PR-time caching stays in build.yml's
          # extras job (the release-dryrun job mirrors this `false`). t-yaxa
          cache: false

      # syft is required by GoReleaser's `sboms` pipe (it is NOT preinstalled on
      # the runner); without it the release fails when it tries to catalog each
      # archive. download-syft only fetches the binary (no cataloging here).
      - name: install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # The pin is a CONCRETE glyph release tag — the action verifies the
      # binary against that release's checksums + build provenance. Keep this
      # ref, `version:` and the release-notes action's ref below in lockstep
      # when bumping: that action runs the binary installed here.
      - name: install glyph
        uses: akira-toriyama/glyph/.github/actions/install@v6.1.0
        with:
          version: v6.1.0
          token: ${{ github.token }}

      # The tag-time notes rule is the action's (its header), not this file's:
      # glyph resolves the walk base itself (`--since-tag=below:<tag>`), and
      # every tag, rc or full, walks from the last full release below it
      # (v8.0.0 from v7.0.0, not v8.0.0-rc.1) — a hand-rolled
      # `git describe HEAD^` takes the rc and publishes notes for the one
      # release-prep commit between them. Exits 1 (nothing release-worthy) and
      # 3 (the walk reaches a commit glyph refuses — the wedge-escape tag's own
      # walk always does) publish a placeholder body that says why, so the
      # pushed tag never ends up without assets; every other exit fails the
      # job. The walk reads tags and history: keep checkout's fetch-depth: 0.
      - name: release notes (glyph)
        id: notes
        uses: akira-toriyama/glyph/.github/actions/release-notes@v6.1.0
        with:
          token: ${{ github.token }}

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Pin the GoReleaser tool to the v2 line (never `latest`) so a major
          # bump can't silently change the release build.
          version: "~> 2"
          args: release --clean --release-notes ${{ steps.notes.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tag this run is FOR, stated — never left for GoReleaser to pick
          # among the tags on this commit. glyph's v3.3.0 push, cut on the same
          # tree as its last rc, built 3.3.0-rc.2 artifacts (measured there
          # 2026-09-10). Empty on a non-tag run, which leaves the choice as it was.
          GORELEASER_CURRENT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          # Private half of homebrew-tap's write deploy key (fleet-sync fans it
          # out); GoReleaser pushes the cask over SSH with it. t-6bhz
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      # Build provenance: a free, keyless GitHub attestation binding each release
      # artifact's digest to THIS workflow run (audit F10). sync-task-status.yml
      # verifies it with `gh attestation verify` after the sha256 check, so the
      # integrity chain no longer rests solely on the same release's checksums.txt.
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      # The SBOM attest steps need CONCRETE paths. actions/attest glob-expands
      # `subject-path` but NOT `sbom-path` (it fs.stat()s the raw string), so a
      # wildcard there would stat a literal "*" filename, throw "SBOM file not
      # found", and fail the release AFTER GoReleaser has already published the
      # draft and pushed the Homebrew cask — a half-shipped release. Derive the
      # version from the archives GoReleaser actually produced (rather than the
      # ref) so the paths are exact and a missing archive fails loudly here.
      # Resolve the version from the artifacts that actually exist, and assert in
      # the same breath that every path the attest steps below are about to use
      # resolves to a real file (sbom-path is NOT glob-expanded) and that
      # checksums.txt names each archive exactly once as a whole field. This is
      # the same script build.yml runs against a snapshot on every PR — sharing it
      # is the point: the paths asserted there are literally the paths attested
      # here, so the two cannot drift.
      - name: Resolve release version + assert the artifact shape
        id: rel
        run: sh scripts/check-release-artifacts.sh dist

      # Sign each archive's SBOM with a Sigstore attestation, binding it to the
      # SAME digest the provenance step attested (subject = the tar.gz). The
      # action takes exactly one sbom-path per call, so there is one step per
      # archive (4 platforms).
      #
      # actions/attest, not actions/attest-sbom: the latter is deprecated and now
      # only a composite wrapper that prints a warning and forwards to
      # actions/attest@a1948c3f (v4.1.1) — this exact SHA — with the inputs
      # unchanged. So this is a pure `uses:` swap: `sbom-path` is a first-class
      # input of actions/attest ("when provided, creates an SBOM attestation"),
      # NOT something to rewrite as predicate-type/predicate-path. The
      # predicateType is still derived from the document's SPDX version
      # (SPDX-2.3 -> https://spdx.dev/Document/v2.3), which is the value the
      # READMEs tell users to pass to `gh attestation verify` — pinned in
      # .goreleaser.yaml's syft args and asserted by check-release-artifacts.sh.
      #
      # sbom-path is NOT glob-expanded (subject-path is) — the paths below must
      # stay concrete. That is v0.8.0's first CRITICAL; the `rel` step above now
      # asserts every one of them resolves, on this run and on every PR.
      - name: Attest SBOM (linux amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/furrow_${{ steps.rel.outputs.version }}_linux_amd64.tar.gz
          sbom-path: dist/furrow_${{ steps.rel.outputs.version }}_linux_amd64.tar.gz.spdx.sbom.json
      - name: Attest SBOM (linux arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/furrow_${{ steps.rel.outputs.version }}_linux_arm64.tar.gz
          sbom-path: dist/furrow_${{ steps.rel.outputs.version }}_linux_arm64.tar.gz.spdx.sbom.json
      - name: Attest SBOM (darwin amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/furrow_${{ steps.rel.outputs.version }}_darwin_amd64.tar.gz
          sbom-path: dist/furrow_${{ steps.rel.outputs.version }}_darwin_amd64.tar.gz.spdx.sbom.json
      - name: Attest SBOM (darwin arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/furrow_${{ steps.rel.outputs.version }}_darwin_arm64.tar.gz
          sbom-path: dist/furrow_${{ steps.rel.outputs.version }}_darwin_arm64.tar.gz.spdx.sbom.json
